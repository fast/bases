name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install nightly lint toolchain
        run: >-
          rustup toolchain install nightly
          --profile minimal
          --component clippy
          --component rustfmt
          --allow-downgrade
          --no-self-update

      - name: Restore Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install repository tools
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: hawkeye@7.0.0,taplo-cli,typos-cli

      - name: Lint workspace
        run: cargo x lint

      - name: Check feature configurations
        run: cargo x check

      - name: Exercise benchmark workloads
        run: cargo x bench -- --test

  msrv:
    name: Resolve MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.rust.outputs.versions }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read supported Rust versions
        id: rust
        run: |
          msrv=$(yq -er '.workspace.package.rust-version' Cargo.toml)
          versions=$(jq -cn --arg msrv "$msrv" '[$msrv, "stable"]')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    needs: msrv
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
        rust: ${{ fromJSON(needs.msrv.outputs.versions) }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --no-self-update

      - name: Restore Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run tests
        run: cargo x test

  target:
    name: Targets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTFLAGS: -D warnings
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust targets
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu wasm32-unknown-unknown thumbv7em-none-eabi

      - name: Restore Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check targets and no_std features
        run: |
          RUSTFLAGS="-D warnings -C target-feature=+avx2" cargo check --package bases --target x86_64-unknown-linux-gnu --locked --all-features
          RUSTFLAGS="-D warnings -C target-feature=+ssse3" cargo check --package bases --target x86_64-unknown-linux-gnu --locked --no-default-features
          RUSTFLAGS="-D warnings -C target-feature=+neon" cargo check --package bases --target aarch64-unknown-linux-gnu --locked --no-default-features
          cargo check --package bases --target wasm32-unknown-unknown --locked --no-default-features
          RUSTFLAGS="-D warnings -C target-feature=+simd128" cargo check --package bases --target wasm32-unknown-unknown --locked --no-default-features
          cargo check --package bases --target thumbv7em-none-eabi --locked --no-default-features
          cargo check --package bases --target thumbv7em-none-eabi --locked --no-default-features --features alloc
          cargo check --package bases --target thumbv7em-none-eabi --locked --no-default-features --features serde
          cargo check --package bases --target thumbv7em-none-eabi --locked --no-default-features --features alloc,serde

  required:
    name: Required
    if: ${{ always() }}
    needs: [lint, msrv, test, target]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          JOBS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$JOBS"
