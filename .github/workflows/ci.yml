name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Run native Linux benchmarks on ARM64 and x86_64
        type: boolean
        default: false
      benchmark_base:
        description: Library revision to compare using the selected revision's harness
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  benchmark:
    name: Benchmark (${{ matrix.runner }})
    if: github.event_name == 'workflow_dispatch' && inputs.benchmarks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Compare revisions and ecosystem peers
        env:
          BENCHMARK_BASE: ${{ inputs.benchmark_base }}
          BENCHMARK_RESULTS: ${{ runner.temp }}/benchmark-results
        run: bash benchmarks/linux.sh "$BENCHMARK_BASE" "$BENCHMARK_RESULTS"

      - name: Save raw measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks-${{ matrix.runner }}
          path: ${{ runner.temp }}/benchmark-results
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install nightly lint toolchain
        run: >-
          rustup toolchain install nightly
          --profile minimal
          --component clippy
          --component rustfmt
          --allow-downgrade
          --no-self-update

      - name: Restore Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install repository tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: hawkeye@7.0.0,taplo-cli,typos-cli

      - name: Lint workspace
        run: cargo x lint

      - name: Check feature configurations
        run: cargo x check

      - name: Exercise benchmark workloads
        run: cargo x bench -- --test

  msrv:
    name: Resolve MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.rust.outputs.versions }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read supported Rust versions
        id: rust
        run: |
          msrv=$(yq -er '.workspace.package.rust-version' Cargo.toml)
          versions=$(jq -cn --arg msrv "$msrv" '[$msrv, "stable"]')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    needs: msrv
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
        rust: ${{ fromJSON(needs.msrv.outputs.versions) }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --no-self-update

      - name: Restore Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run tests
        run: cargo x test

  target:
    name: Target (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64 AVX2
            target: x86_64-unknown-linux-gnu
            features: --all-features
            rustflags: -C target-feature=+avx2
          - name: x86_64 SSSE3
            target: x86_64-unknown-linux-gnu
            features: --no-default-features
            rustflags: -C target-feature=+ssse3
          - name: AArch64 NEON
            target: aarch64-unknown-linux-gnu
            features: --no-default-features
            rustflags: -C target-feature=+neon
          - name: WebAssembly
            target: wasm32-unknown-unknown
            features: --no-default-features
            rustflags: ""
          - name: WebAssembly SIMD128
            target: wasm32-unknown-unknown
            features: --no-default-features
            rustflags: -C target-feature=+simd128
          - name: bare metal
            target: thumbv7em-none-eabi
            features: --no-default-features
            rustflags: ""
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTFLAGS: -D warnings ${{ matrix.rustflags }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add "${{ matrix.target }}"

      - name: Restore Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Check target
        run: cargo check --package bases --target "${{ matrix.target }}" --locked ${{ matrix.features }}

      - name: Check no_std feature combinations
        if: matrix.target == 'thumbv7em-none-eabi'
        run: |
          cargo check --package bases --target thumbv7em-none-eabi --locked --no-default-features --features alloc
          cargo check --package bases --target thumbv7em-none-eabi --locked --no-default-features --features serde
          cargo check --package bases --target thumbv7em-none-eabi --locked --no-default-features --features alloc,serde

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Restore Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Validate package contents
        shell: bash
        run: |
          package_files="$(cargo package --package bases --locked --list)"
          for required in Cargo.lock Cargo.toml README.md LICENSE src/lib.rs; do
            grep -Fxq "$required" <<< "$package_files" || {
              echo "missing required package file: $required" >&2
              exit 1
            }
          done
          if grep -Eq '^(benchmarks|examples|tests-integration|xtask|target)/' <<< "$package_files"; then
            echo "development-only files leaked into the package" >&2
            exit 1
          fi

      - name: Build package
        run: cargo package --package bases --locked

      - name: Test package
        shell: bash
        run: |
          package_dir="$(find target/package -mindepth 1 -maxdepth 1 -type d -name 'bases-*' -print -quit)"
          test -n "$package_dir"
          cargo test --manifest-path "$package_dir/Cargo.toml" --all-features --locked
          cargo test --manifest-path "$package_dir/Cargo.toml" --no-default-features --locked
          cargo test --manifest-path "$package_dir/Cargo.toml" --no-default-features --features alloc,serde --locked
          cargo test --manifest-path "$package_dir/Cargo.toml" --no-default-features --features serde --locked

  required:
    name: Required
    if: ${{ always() }}
    needs: [lint, msrv, test, target, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          JOBS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$JOBS"
