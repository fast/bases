[workspace]
members = ["bases", "benchmarks", "examples", "tests-integration", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/fast/bases"
rust-version = "1.88.0"

[workspace.dependencies]
# Workspace dependencies
bases = { path = "bases" }
serde_core = { version = "1.0", default-features = false }

# Development dependencies
base16ct = { version = "1.0.0" }
base32ct = { version = "0.3.1" }
base64 = { version = "0.23.1" }
base64-simd = { version = "0.8.0" }
base64ct = { version = "1.8.3" }
clap = { version = "4.6.7", features = ["derive"] }
const-hex = { version = "1.19.3" }
data-encoding = { version = "2.11.0" }
faster-hex = { version = "0.10.1", default-features = false, features = [
  "std",
] }
googletest = { version = "0.14.4", default-features = false }
hex = { version = "0.4.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
which = { version = "8.0.6" }

[workspace.lints.rust]
unknown_lints = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.metadata.release]
pre-release-commit-message = "chore: release v{{version}}"
shared-version = true
sign-tag = true
tag-name = "v{{version}}"

[profile.release]
codegen-units = 1
lto = "thin"
